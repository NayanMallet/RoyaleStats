# Orchestration de la stack RoyaleStats.
# Ordre de démarrage : services métier → api-gateway → front, chaque étape attend que
# les services dont elle dépend soient "healthy" (healthcheck sur /health).

x-node-service: &node-service
  env_file: .env
  restart: unless-stopped
  networks: [microservices-net]
  deploy:
    resources:
      limits:
        cpus: '0.50'
        memory: 256M
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

services:
  public-api:
    <<: *node-service
    build:
      context: .
      dockerfile: public-api/Dockerfile
    ports:
      - '3001:3001'
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3001/health']

  user-service:
    <<: *node-service
    platform: linux/amd64
    build:
      context: .
      dockerfile: user-service/Dockerfile
    ports:
      - '3002:3002'
    environment:
      - USER_DB_FILE=/data/user-service/database.sqlite
    volumes:
      - ./data/user-service:/data/user-service
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3002/health']

  item-service:
    <<: *node-service
    platform: linux/amd64
    build:
      context: .
      dockerfile: item-service/Dockerfile
    ports:
      - '3003:3003'
    environment:
      - ITEM_DB_FILE=/data/item-service/database.sqlite
    volumes:
      - ./data/item-service:/data/item-service
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3003/health']

  clash-data-service:
    <<: *node-service
    platform: linux/amd64
    build:
      context: .
      dockerfile: clash-data-service/Dockerfile
    ports:
      - '3004:3004'
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3004/health']

  link-service:
    <<: *node-service
    platform: linux/amd64
    build:
      context: .
      dockerfile: link-service/Dockerfile
    ports:
      - '3005:3005'
    environment:
      - LINK_DB_FILE=/data/link-service/database.sqlite
      - CLASH_DATA_SERVICE_URL=http://clash-data-service:3004
    volumes:
      - ./data/link-service:/data/link-service
    depends_on:
      clash-data-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3005/health']

  meta-tracker-service:
    <<: *node-service
    platform: linux/amd64
    build:
      context: .
      dockerfile: meta-tracker-service/Dockerfile
    ports:
      - '3006:3006'
    environment:
      - META_DB_FILE=/data/meta-tracker-service/database.sqlite
      - CLASH_DATA_SERVICE_URL=http://clash-data-service:3004
    volumes:
      - ./data/meta-tracker-service:/data/meta-tracker-service
    depends_on:
      clash-data-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3006/health']

  api-gateway:
    <<: *node-service
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - USER_SERVICE_URL=http://user-service:3002
      - ITEM_SERVICE_URL=http://item-service:3003
      - CLASH_DATA_SERVICE_URL=http://clash-data-service:3004
      - LINK_SERVICE_URL=http://link-service:3005
      - META_TRACKER_SERVICE_URL=http://meta-tracker-service:3006
      - PUBLIC_API_URL=http://public-api:3001
    depends_on:
      public-api:
        condition: service_healthy
      user-service:
        condition: service_healthy
      item-service:
        condition: service_healthy
      clash-data-service:
        condition: service_healthy
      link-service:
        condition: service_healthy
      meta-tracker-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/health']

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    ports:
      - '8080:80'
    restart: unless-stopped
    networks: [microservices-net]
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/']

networks:
  microservices-net:
    driver: bridge
